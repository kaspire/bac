<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BP Series Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d0d;--surface:#141414;--surface2:#1c1c1c;--border:#252525;
  --text:#e8e4d9;--muted:#555;--gold:#c9a84c;
  --P:#1565c0;--P-bright:#2196f3;--P-dim:#0a1628;
  --B:#8b1a1a;--B-bright:#e74c3c;--B-dim:#280a0a;
  --pos:#52b788;--neg:#e74c3c;--warn:#e07c3a;--zero:#555;--closed:#1a1a1a;
}
html,body{overflow-x:hidden}
body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;min-height:100vh;display:flex;flex-direction:column}

.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hdr-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:.08em;color:var(--gold)}
.hdr-sub{font-size:10px;color:var(--muted);letter-spacing:.08em}
.round-badge{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--gold);background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:2px 12px;margin-left:auto;display:flex;align-items:baseline;gap:6px}
.round-badge span{font-size:10px;color:var(--muted);font-family:'DM Mono',monospace}
.btn{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.06em;padding:6px 14px;border-radius:4px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);cursor:pointer;transition:all .12s}
.btn:hover{color:var(--text);border-color:#444}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn.danger{border-color:rgba(231,76,60,.3);color:var(--B-bright)}
.btn.export{border-color:rgba(201,168,76,.3);color:var(--gold)}

.main{display:grid;grid-template-columns:140px 1fr 240px;gap:0;flex:1;min-height:0;overflow:hidden}

/* OUTCOME */
.outcome-col{background:var(--surface);border-right:1px solid var(--border);padding:14px 10px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.oc-lbl{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.ob{border-radius:6px;border:2px solid transparent;cursor:pointer;text-align:center;padding:12px 6px;font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:.04em;transition:all .12s;user-select:none}
.ob.P{background:var(--P-dim);border-color:var(--P);color:var(--P-bright)}.ob.P:hover{background:var(--P);color:#fff}
.ob.T{background:#0f2016;border-color:#2d5a3d;color:#52b788}.ob.T:hover{background:#1a3d28}
.ob.B{background:var(--B-dim);border-color:var(--B);color:var(--B-bright)}.ob.B:hover{background:var(--B);color:#fff}
.ob-sub{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.07em;opacity:.6;margin-top:2px}
.win-loss{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.wlb{border-radius:5px;border:1px solid;cursor:pointer;text-align:center;padding:8px 4px;font-family:'Bebas Neue',sans-serif;font-size:20px;transition:all .12s}
.wlb.W{background:#0d2018;border-color:#2d6a4f;color:#52b788}.wlb.W:hover{background:#1a3d28}
.wlb.L{background:var(--B-dim);border-color:var(--B);color:var(--B-bright)}.wlb.L:hover{background:var(--B)}
.wlb.disabled{opacity:.3;pointer-events:none}
.cluster-box{background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:8px 10px}
.cluster-lbl{font-size:9px;color:var(--muted);letter-spacing:.07em;margin-bottom:6px}
.cluster-pips{display:flex;gap:5px}
.pip{width:16px;height:16px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:500}
.pip.win{background:var(--pos);color:#fff}.pip.loss{background:var(--neg);color:#fff}
.exit-box{background:#0f1a09;border:2px solid var(--pos);border-radius:5px;padding:8px 10px;text-align:center;display:none}
.exit-box.show{display:block}
.exit-title{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--pos)}
.stop-box{background:#1a0505;border:2px solid var(--B-bright);border-radius:5px;padding:8px 10px;text-align:center;display:none}
.stop-box.show{display:block}
.stop-title{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--B-bright)}

/* GRID */
.grid-col{overflow:auto;background:var(--bg)}
.series-table{border-collapse:collapse;font-size:12px;white-space:nowrap}
.series-table th{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:.06em;padding:5px 8px;text-align:center;background:var(--surface);border:1px solid var(--border);color:var(--muted);position:sticky;top:0;z-index:2}
.series-table th.th-P{color:var(--P-bright)}.series-table th.th-B{color:var(--B-bright)}.series-table th.th-S{color:var(--muted)}.series-table th.th-ser{color:var(--gold)}
.series-table td{padding:3px 7px;text-align:center;border:1px solid var(--border);font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:.04em}
.series-table tr.latest td{background:rgba(255,255,255,.03)}
.td-num{color:var(--muted);font-size:11px;background:var(--surface)!important}
.td-standing{font-size:9px;background:var(--surface)!important;min-width:32px}
.s-W{color:var(--pos)}.s-L{color:var(--B-bright)}
.dot-P{color:var(--P-bright)}.dot-B{color:var(--B-bright)}.dot-T{color:#52b788;font-size:10px}
.val-pos{color:var(--pos)}.val-neg{color:var(--neg)}.val-zero{color:var(--zero)}
.val-warn{color:var(--warn)!important}.val-zone{color:var(--gold)!important}
.val-closed{color:#2a2a2a}.val-empty{color:var(--border)}
.val-signal{background:rgba(201,168,76,.12)!important;color:var(--gold)!important}
.vote-chop{background:rgba(82,183,136,.06)!important}
.vote-streak{background:rgba(33,150,243,.06)!important}

/* SIGNAL */
.signal-col{background:var(--surface);border-left:1px solid var(--border);padding:14px 12px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.sig-lbl{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.sig-box{border-radius:7px;border:2px solid var(--border);background:var(--surface2);overflow:hidden;transition:all .25s}
.sig-box.active-P{border-color:var(--P);box-shadow:0 0 14px rgba(21,101,192,.3)}
.sig-box.active-B{border-color:var(--B-bright);box-shadow:0 0 14px rgba(231,76,60,.3)}
.sig-box.active-strong{border-color:var(--gold);box-shadow:0 0 18px rgba(201,168,76,.3)}
.sig-hdr{padding:7px 10px;background:var(--surface);display:flex;align-items:center;gap:6px}
.sig-name{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:.06em;flex:1}
.sig-str{font-size:9px;padding:2px 6px;border-radius:3px;letter-spacing:.05em;text-transform:uppercase}
.sig-str.strong{background:rgba(201,168,76,.2);color:var(--gold);border:1px solid rgba(201,168,76,.4)}
.sig-str.moderate{background:rgba(82,183,136,.15);color:var(--pos);border:1px solid rgba(82,183,136,.3)}
.sig-body{padding:8px 10px;display:flex;align-items:center;gap:8px}
.sig-chip{font-family:'Bebas Neue',sans-serif;font-size:44px;width:56px;height:56px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:2px solid transparent}
.sig-chip.P{background:var(--P);color:#fff;border-color:var(--P-bright)}
.sig-chip.B{background:var(--B);color:#fff;border-color:var(--B-bright)}
.sig-chip.none{background:var(--surface2);color:var(--muted);border-color:var(--border);font-size:20px}
.sig-meta{flex:1;display:flex;flex-direction:column;gap:3px}
.sig-action{font-size:10px;color:var(--text)}
.sig-mult{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--gold)}
.sig-reason{font-size:9px;color:var(--muted);line-height:1.4}
.sig-footer{padding:5px 10px 7px;font-size:9px;color:var(--muted);border-top:1px solid var(--border)}

/* VOTE BAR */
.vote-bar{display:flex;gap:6px;align-items:center;margin-top:4px}
.vote-seg{height:6px;border-radius:3px;transition:width .2s}
.vote-chop-bar{background:var(--pos)}.vote-streak-bar{background:var(--P-bright)}.vote-split-bar{background:var(--warn)}
.vote-lbl{font-size:9px;color:var(--muted)}

/* LAST BETS */
.last-bets{display:flex;gap:4px;flex-wrap:wrap}
.lb{font-size:10px;padding:2px 6px;border-radius:3px;border:1px solid}
.lb.W{background:#0d2018;color:var(--pos);border-color:#2d6a4f}
.lb.L{background:var(--B-dim);color:var(--B-bright);border-color:var(--B)}
.lb.cur{border-color:var(--gold)!important}
</style>
</head>
<body>

<div class="hdr">
  <div><div class="hdr-title">BP Series Tracker</div><div class="hdr-sub">unanimous vote · oscillation signals · export</div></div>
  <div class="round-badge"><span>Hands</span><span id="handCount">0</span></div>
  <button class="btn" id="undoBtn" onclick="undo()" disabled>↩ Undo</button>
  <button class="btn danger" onclick="newShoe()">✕ New Shoe</button>
  <button class="btn export" onclick="exportCSV()">↓ Export CSV</button>
</div>

<div class="main">
  <!-- OUTCOME -->
  <div class="outcome-col">
    <div class="oc-lbl">Outcome</div>
    <div class="ob P" onclick="record('P')">P<div class="ob-sub">Player</div></div>
    <div class="ob T" onclick="record('T')">T<div class="ob-sub">Tie</div></div>
    <div class="ob B" onclick="record('B')">B<div class="ob-sub">Banker</div></div>
    <div class="oc-lbl" style="margin-top:6px">Result</div>
    <div class="win-loss">
      <div class="wlb W disabled" id="winBtn" onclick="recordResult('W')">W</div>
      <div class="wlb L disabled" id="lossBtn" onclick="recordResult('L')">L</div>
    </div>
    <div class="cluster-box">
      <div class="cluster-lbl">Cluster (0/4)</div>
      <div class="cluster-pips">
        <div class="pip" id="pip0">1</div>
        <div class="pip" id="pip1">2</div>
        <div class="pip" id="pip2">3</div>
        <div class="pip" id="pip3">4</div>
      </div>
    </div>
    <div class="exit-box" id="exitBox"><div class="exit-title">🏆 EXIT</div><div style="font-size:9px;color:var(--muted);margin-top:3px">4 wins · done</div></div>
    <div class="stop-box" id="stopBox"><div class="stop-title">⛔ STOP</div><div style="font-size:9px;color:var(--muted);margin-top:3px">2 losses · wait</div></div>
  </div>

  <!-- GRID -->
  <div class="grid-col">
    <table class="series-table" id="seriesTable">
      <thead id="seriesHead"></thead>
      <tbody id="seriesBody"></tbody>
    </table>
  </div>

  <!-- SIGNAL -->
  <div class="signal-col">
    <div>
      <div class="sig-lbl">Signal</div>
      <div class="sig-box" id="sigBox">
        <div class="sig-hdr"><div class="sig-name" id="sigName">Watching</div><span class="sig-str moderate" id="sigStr" style="display:none"></span></div>
        <div class="sig-body">
          <div class="sig-chip none" id="sigChip">?</div>
          <div class="sig-meta">
            <div class="sig-action" id="sigAction">Enter outcomes</div>
            <div class="sig-mult" id="sigMult" style="display:none"></div>
            <div class="sig-reason" id="sigReason"></div>
          </div>
        </div>
        <div class="sig-footer" id="sigFooter">No signal</div>
      </div>
    </div>

    <!-- VOTE -->
    <div>
      <div class="sig-lbl">Series vote</div>
      <div id="voteDisplay" style="font-size:10px;color:var(--muted)">—</div>
    </div>

    <!-- RECENT -->
    <div>
      <div class="sig-lbl">Recent results</div>
      <div class="last-bets" id="lastBets"><span style="font-size:10px;color:var(--muted)">None yet</span></div>
    </div>
  </div>
</div>

<script>
/* ── STATE ── */
let hands=[], series=[], seriesCounter=0;
let lastBP=null, firstChopDone=false, bpCount=0;
let cluster={wins:0,losses:0,results:[]};
let lastSignal=null;

/* ── SERIES ENGINE ── */
function freshSeries(initVal,startBP){
  seriesCounter++;
  return{id:seriesCounter,value:initVal,closed:false,startBP,
    initValue:initVal,zeroSpawned:false,snap:{}};
}

function recordBP(o,bpIdx){
  if(lastBP===null){
    const s1=freshSeries(+1,bpIdx); s1.snap[bpIdx]=+1; series.push(s1);
    const s2=freshSeries(-1,bpIdx); s2.snap[bpIdx]=-1; series.push(s2);
    lastBP=o; return;
  }
  const isChop=o!==lastBP;
  const delta=isChop?+1:-1;
  const rescueSpawns=[], negZeroSpawns=[];
  const existing=[...series];

  for(const s of existing){
    if(s.closed)continue;
    s.value+=delta;
    s.snap[bpIdx]=s.value;
    if(s.value>=4||s.value<=-4){
      s.closed=true;
      if(s.value<=-4) rescueSpawns.push(bpIdx);
      continue;
    }
    if(s.initValue===-1&&s.id!==2&&s.value===0&&!s.zeroSpawned){
      s.zeroSpawned=true;
      negZeroSpawns.push(bpIdx);
    }
  }
  if(isChop&&!firstChopDone){
    firstChopDone=true;
    const s3=freshSeries(+1,bpIdx); s3.snap[bpIdx]=+1; series.push(s3);
    const s4=freshSeries(-1,bpIdx); s4.snap[bpIdx]=-1; series.push(s4);
  }
  for(const bi of rescueSpawns){const ns=freshSeries(+1,bi);ns.snap[bi]=+1;series.push(ns);}
  for(const bi of negZeroSpawns){const ns=freshSeries(-1,bi);ns.snap[bi]=-1;series.push(ns);}
  lastBP=o;
}

/* ── VOTE ENGINE ── */
function computeVote(){
  // For each active series, determine if current value is at HIGH or LOW
  // by comparing to previous snap value
  const active=series.filter(s=>!s.closed&&s.snap[bpCount]!==undefined);
  if(active.length<2)return{vote:null,chopVotes:0,streakVotes:0,total:0,details:[]};

  let chopVotes=0, streakVotes=0;
  const details=[];

  for(const s of active){
    const cur=s.snap[bpCount];
    const prev=s.snap[bpCount-1];
    if(prev===undefined){details.push({id:s.id,cur,need:'?'});continue;}
    const isHigh=cur>prev; // came up last step → at HIGH → needs -1 (streak)
    const isLow=cur<prev;  // came down last step → at LOW → needs +1 (chop)
    if(isHigh){streakVotes++;details.push({id:s.id,cur,need:'streak'});}
    else if(isLow){chopVotes++;details.push({id:s.id,cur,need:'chop'});}
    else{details.push({id:s.id,cur,need:'?'});}
  }

  const total=chopVotes+streakVotes;
  const unanimous=total>=2&&(chopVotes===total||streakVotes===total);
  const vote=unanimous?(chopVotes===total?'chop':'streak'):null;
  return{vote,chopVotes,streakVotes,total,details,unanimous};
}

/* ── SIGNAL DETECTION ── */
function fullHist(s){
  const keys=Object.keys(s.snap).map(Number).sort((a,b)=>a-b);
  return keys.map(k=>s.snap[k]);
}

function countAlternatingRun(arr,a,b){
  if(!arr.length)return 0;
  const last=arr[arr.length-1];
  if(last!==a&&last!==b)return 0;
  let count=1;
  for(let i=arr.length-2;i>=0;i--){
    const expected=count%2===0?last:(last===a?b:a);
    if(arr[i]===expected)count++;else break;
  }
  return count;
}

function detectSignal(){
  if(!lastBP||bpCount<2)return null;
  const chopBet=lastBP==='B'?'P':'B';
  const streakBet=lastBP;

  // ── CORE: unanimous vote ──
  const{vote,chopVotes,streakVotes,total,unanimous}=computeVote();
  if(unanimous&&vote){
    const side=vote==='chop'?chopBet:streakBet;
    const type=vote;

    // Check for S2 special signals (override multiplier)
    const s2=series.find(s=>s.id===2);
    if(s2&&!s2.closed){
      const hist=fullHist(s2);
      const run=countAlternatingRun(hist,-1,0);
      if(run===6&&vote==='streak')
        return{side,name:'S2 Complete',strength:'strong',mult:1,
          reason:`S2 6-round −1/0 complete · all ${total} series agree`,type};
      if(run===5&&vote==='chop')
        return{side,name:'S2 Oscillation',strength:'strong',mult:2,
          reason:`S2 5-round · all ${total} series agree`,type};
      // S2 crosses positive first time
      if(s2.value>0&&vote==='streak'){
        const prevVal=hist.length>=2?hist[hist.length-2]:null;
        if(prevVal!==null&&prevVal<=0){
          const prevRun=countAlternatingRun(hist.slice(0,-1),-1,0);
          if(prevRun>=6)
            return{side,name:'S2 Breakout',strength:'STRONG',mult:4,
              reason:`S2 breaks +${s2.value} after 6-round · all ${total} agree`,type};
        }
      }
    }

    // Check rescue series oscillation (override multiplier)
    const rescueSeries=series.filter(s=>s.initValue===+1&&s.id>4&&!s.closed);
    for(const rs of rescueSeries){
      const run=countAlternatingRun(fullHist(rs),0,1);
      if(run>=5&&vote==='chop')
        return{side,name:'Rescue 10101',strength:'STRONG',mult:8,
          reason:`Series ${rs.id} 0/1×${run} · all ${total} agree`,type};
      if(run>=4&&vote==='chop')
        return{side,name:'Re-entry ×6',strength:'strong',mult:6,
          reason:`Series ${rs.id} 0/1×${run} · all ${total} agree`,type};
    }

    // Standard unanimous signal
    return{side,name:vote==='chop'?'All LOW — Chop':'All HIGH — Streak',
      strength:'moderate',mult:1,
      reason:`${total} series unanimous — ${vote}`,type};
  }
  return null;
}

/* ── RENDER ── */
function render(){
  bpCount=hands.filter(h=>h.outcome!=='T').length;
  document.getElementById('handCount').textContent=hands.length;
  document.getElementById('undoBtn').disabled=!hands.length;
  renderGrid();
  renderSignal();
  renderCluster();
}

function renderGrid(){
  const head=document.getElementById('seriesHead');
  const body=document.getElementById('seriesBody');
  const allIds=[...new Set(series.map(s=>s.id))].sort((a,b)=>a-b);

  head.innerHTML=`<tr>
    <th class="th-num">#</th><th class="th-P">P</th><th class="th-B">B</th><th class="th-S">S</th>
    ${allIds.map(id=>`<th class="th-ser">${id}</th>`).join('')}
  </tr>`;

  if(!hands.length){
    body.innerHTML=`<tr><td class="td-num" colspan="${4+allIds.length}" style="padding:16px;color:var(--muted);font-size:10px">Enter outcomes to begin</td></tr>`;
    return;
  }

  const sig=detectSignal();
  lastSignal=sig;
  const vote=computeVote();

  let bpIdx=0;
  body.innerHTML=hands.map((h,hi)=>{
    if(h.outcome!=='T')bpIdx++;
    const isLatest=hi===hands.length-1;
    const curBP=h.outcome!=='T'?bpIdx:null;
    const pM=h.outcome==='P'?`<span class="dot-P">O</span>`:'';
    const bM=h.outcome==='B'?`<span class="dot-B">O</span>`:'';
    const tM=h.outcome==='T'?`<span class="dot-T">T</span>`:'';
    const sM=h.standing||'';

    // Row vote class
    let rowVoteCls='';
    if(isLatest&&vote.unanimous){
      rowVoteCls=vote.vote==='chop'?'vote-chop':'vote-streak';
    }

    const cells=h.outcome==='T'
      ?allIds.map(()=>`<td class="val-empty">·</td>`).join('')
      :allIds.map(id=>{
        const s=series.find(s=>s.id===id);
        const v=s.snap[curBP];
        if(v===undefined)return`<td class="val-empty">·</td>`;
        // Show ✕ if series closed and next hand has no snap
        if(s.closed&&s.snap[curBP+1]===undefined&&(v>=4||v<=-4)){
          // closing hand — show value in dim
        } else if(s.closed&&v===undefined){
          return`<td class="val-closed">✕</td>`;
        }
        let cls='';
        if(v>0)cls='val-pos';else if(v<0)cls='val-neg';else cls='val-zero';
        if(v===-3)cls='val-warn';
        if(v>=3&&v<4)cls='val-zone';
        if(v>=4||v<=-4)cls='val-closed';
        if(isLatest&&sig&&(id===2))cls='val-signal';
        return`<td class="${cls}">${v>0?'+':''}${v}</td>`;
      }).join('');

    return`<tr class="${isLatest?'latest':''} ${rowVoteCls}">
      <td class="td-num">${hi+1}</td>
      <td>${pM}${tM}</td><td>${bM}</td>
      <td class="td-standing"><span class="${sM.includes('L')?'s-L':'s-W'}">${sM}</span></td>
      ${cells}
    </tr>`;
  }).join('');

  const gc=document.querySelector('.grid-col');
  if(gc)gc.scrollTop=gc.scrollHeight;
}

function renderSignal(){
  const sig=lastSignal||detectSignal();
  const vote=computeVote();
  const box=document.getElementById('sigBox');
  const chip=document.getElementById('sigChip');
  const name=document.getElementById('sigName');
  const str=document.getElementById('sigStr');
  const action=document.getElementById('sigAction');
  const mult=document.getElementById('sigMult');
  const reason=document.getElementById('sigReason');
  const footer=document.getElementById('sigFooter');
  const voteEl=document.getElementById('voteDisplay');

  // Vote display
  if(vote.total>0){
    const chopPct=Math.round(vote.chopVotes/vote.total*100);
    const streakPct=100-chopPct;
    voteEl.innerHTML=`
      <div style="display:flex;gap:6px;align-items:center;margin-bottom:4px">
        <div style="flex:1;height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;display:flex">
          <div style="width:${chopPct}%;background:var(--pos);height:100%"></div>
          <div style="width:${streakPct}%;background:var(--P-bright);height:100%"></div>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:9px">
        <span style="color:var(--pos)">Chop ${vote.chopVotes}</span>
        <span style="color:${vote.unanimous?'var(--gold)':'var(--warn)'}">${vote.unanimous?'UNANIMOUS':'SPLIT'}</span>
        <span style="color:var(--P-bright)">Streak ${vote.streakVotes}</span>
      </div>`;
  } else {
    voteEl.innerHTML=`<span style="color:var(--muted);font-size:10px">Need 2+ hands</span>`;
  }

  if(!sig){
    box.className='sig-box';
    chip.className='sig-chip none';chip.textContent='?';
    name.textContent='Watching';str.style.display='none';
    action.textContent=bpCount<2?'Enter outcomes':'No signal — waiting';
    mult.style.display='none';reason.textContent='';
    footer.textContent=vote.total>0&&!vote.unanimous?`Split vote — ${vote.chopVotes} chop / ${vote.streakVotes} streak`:'Unanimous required';
    return;
  }

  box.className=`sig-box ${sig.strength==='STRONG'?'active-strong':'active-'+sig.side}`;
  chip.className=`sig-chip ${sig.side}`;chip.textContent=sig.side;
  name.textContent=sig.name;
  str.style.display='inline-block';str.className=`sig-str ${sig.strength}`;str.textContent=sig.strength;
  action.textContent=`Bet ${sig.side==='P'?'Player':'Banker'} — ${sig.type}`;
  if(sig.mult>1){mult.style.display='block';mult.textContent=`${sig.mult}× stake`;}
  else{mult.style.display='none';}
  reason.textContent=sig.reason;
  footer.textContent=sig.type==='streak'?'Same as last outcome':'Opposite of last outcome';
}

function renderCluster(){
  for(let i=0;i<4;i++){
    const p=document.getElementById('pip'+i);
    p.className='pip';
    if(i<cluster.results.length)p.classList.add(cluster.results[i]==='W'?'win':'loss');
  }
  const lb=document.getElementById('lastBets');
  const bets=hands.filter(h=>h.result);
  lb.innerHTML=bets.length
    ?bets.slice(-10).map((h,i,arr)=>`<span class="lb ${h.result}${i===arr.length-1?' cur':''}">${h.result}</span>`).join('')
    :'<span style="font-size:10px;color:var(--muted)">None yet</span>';
  let consLoss=0;
  for(let i=cluster.results.length-1;i>=0;i--){if(cluster.results[i]==='L')consLoss++;else break;}
  document.getElementById('exitBox').classList.toggle('show',cluster.wins>=4);
  document.getElementById('stopBox').classList.toggle('show',consLoss>=2&&cluster.wins<4);
  const hasUnresolved=hands.some(h=>h.result===null&&h.outcome!=='T');
  document.getElementById('winBtn').classList.toggle('disabled',!hasUnresolved);
  document.getElementById('lossBtn').classList.toggle('disabled',!hasUnresolved);
}

/* ── EXPORT CSV ── */
function exportCSV(){
  if(!hands.length){alert('No data to export.');return;}
  const allIds=[...new Set(series.map(s=>s.id))].sort((a,b)=>a-b);
  const headers=['Hand','Outcome','BP_Index','Vote','Signal_Name','Signal_Side','Signal_Mult','Result','Standing',...allIds.map(id=>'S'+id)];
  let bpIdx=0;
  const rows=hands.map(h=>{
    if(h.outcome!=='T')bpIdx++;
    const curBP=h.outcome!=='T'?bpIdx:null;
    const vote=h.vote||'';
    const vals=allIds.map(id=>{
      const s=series.find(s=>s.id===id);
      const v=curBP?s.snap[curBP]:undefined;
      return v!==undefined?v:'';
    });
    return[h.handNum,h.outcome,curBP||'',vote,h.sigName||'',h.sigSide||'',h.sigMult||'',h.result||'',h.standing||'',...vals].join(',');
  });
  const csv=[headers.join(','),...rows].join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`bp-shoe-${Date.now()}.csv`;a.click();
  URL.revokeObjectURL(url);
}

/* ── ACTIONS ── */
function record(o){
  const handNum=hands.length+1;
  // Snapshot signal before recording
  const sig=detectSignal();
  const vote=computeVote();
  hands.push({handNum,outcome:o,result:null,standing:'',
    sigName:sig?sig.name:'',sigSide:sig?sig.side:'',sigMult:sig?sig.mult:'',
    vote:vote.vote||''});
  if(o!=='T'){bpCount++;recordBP(o,bpCount);}
  render();
}

function recordResult(res){
  const last=hands.slice().reverse().find(h=>h.result===null&&h.outcome!=='T');
  if(!last)return;
  last.result=res;
  cluster.results.push(res);
  if(res==='W')cluster.wins++;else cluster.losses++;
  last.standing=cluster.results.join('');
  render();
}

function undo(){
  if(!hands.length)return;
  const last=hands[hands.length-1];
  if(last.result!==null){
    cluster.results.pop();
    if(last.result==='W')cluster.wins--;else cluster.losses--;
    last.result=null;last.standing='';
  } else {
    hands.pop();
    if(last.outcome!=='T'){
      series=[];seriesCounter=0;lastBP=null;firstChopDone=false;bpCount=0;
      hands.filter(h=>h.outcome!=='T').forEach((h,i)=>recordBP(h.outcome,i+1));
      bpCount=hands.filter(h=>h.outcome!=='T').length;
    }
  }
  render();
}

function newShoe(){
  if(!confirm('New shoe? All data cleared.'))return;
  hands=[];series=[];seriesCounter=0;lastBP=null;
  firstChopDone=false;bpCount=0;cluster={wins:0,losses:0,results:[]};lastSignal=null;
  render();
}

render();
</script>
