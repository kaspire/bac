<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BP Sync Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d0d;--surface:#141414;--surface2:#1c1c1c;--border:#252525;
  --text:#e8e4d9;--muted:#555;--gold:#c9a84c;--gold-dim:rgba(201,168,76,.12);
  --P:#1565c0;--P-bright:#2196f3;--P-dim:#0a1628;
  --B:#8b1a1a;--B-bright:#e74c3c;--B-dim:#280a0a;
  --pos:#52b788;--neg:#e74c3c;--warn:#e07c3a;--zero:#444;
}
html,body{overflow-x:hidden}
body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;min-height:100vh;display:flex;flex-direction:column}

.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:11px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hdr-title{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.08em;color:var(--gold)}
.hdr-sub{font-size:9px;color:var(--muted);letter-spacing:.07em}
.badge{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--gold);background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:2px 9px;margin-left:auto;display:flex;align-items:baseline;gap:4px}
.badge span{font-size:9px;color:var(--muted);font-family:'DM Mono',monospace}
.btn{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.06em;padding:5px 10px;border-radius:4px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);cursor:pointer;transition:all .12s}
.btn:hover{color:var(--text);border-color:#444}
.btn.danger{border-color:rgba(231,76,60,.3);color:var(--B-bright)}
.btn.gold{border-color:rgba(201,168,76,.4);color:var(--gold)}

.main{display:grid;grid-template-columns:120px 1fr 220px;flex:1;min-height:0;overflow:hidden}

/* OUTCOME */
.oc{background:var(--surface);border-right:1px solid var(--border);padding:11px 9px;display:flex;flex-direction:column;gap:7px;overflow-y:auto}
.oc-lbl{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:1px}
.ob{border-radius:6px;border:2px solid transparent;cursor:pointer;text-align:center;padding:12px 6px;font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:.04em;transition:all .12s;user-select:none}
.ob.P{background:var(--P-dim);border-color:var(--P);color:var(--P-bright)}.ob.P:hover{background:var(--P);color:#fff}
.ob.T{background:#0f2016;border-color:#2d5a3d;color:#52b788}.ob.T:hover{background:#1a3d28}
.ob.B{background:var(--B-dim);border-color:var(--B);color:var(--B-bright)}.ob.B:hover{background:var(--B);color:#fff}
.ob-sub{font-family:'DM Mono',monospace;font-size:9px;opacity:.6;margin-top:1px}
.wl{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.wlb{border-radius:5px;border:1px solid;cursor:pointer;text-align:center;padding:7px 3px;font-family:'Bebas Neue',sans-serif;font-size:20px;transition:all .12s}
.wlb.W{background:#0d2018;border-color:#2d6a4f;color:#52b788}.wlb.W:hover{background:#1a3d28}
.wlb.L{background:var(--B-dim);border-color:var(--B);color:var(--B-bright)}.wlb.L:hover{background:var(--B)}
.wlb.disabled{opacity:.3;pointer-events:none}

/* GRID */
.gc{overflow:auto;background:var(--bg)}
.st{border-collapse:collapse;font-size:12px;white-space:nowrap;width:100%}
.st th{font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:.06em;padding:5px 8px;text-align:center;background:var(--surface);border:1px solid var(--border);color:var(--muted);position:sticky;top:0;z-index:2}
.st th.thP{color:var(--P-bright)}.st th.thB{color:var(--B-bright)}.st th.thS{color:var(--muted)}
.st th.thN{color:var(--muted)}
.st th.thN.synced{color:var(--gold);background:rgba(201,168,76,.1);border-bottom:2px solid var(--gold)}
.st td{padding:4px 7px;text-align:center;border:1px solid var(--border);font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:.04em}
.st tr.latest td{background:rgba(255,255,255,.03)}
.td-n{color:var(--muted);font-size:10px;background:var(--surface)!important;font-family:'DM Mono',monospace}
.td-s{font-size:9px;background:var(--surface)!important;min-width:28px}
.sW{color:var(--pos)}.sL{color:var(--neg)}
.dot-P{color:var(--P-bright)}.dot-B{color:var(--B-bright)}.dot-T{color:#52b788;font-size:10px}
/* value colours */
.vp{color:var(--pos)}.vn{color:var(--neg)}.vz{color:var(--zero)}
.v3{color:var(--gold)!important}.vm3{color:var(--warn)!important}
.v4{color:#252525}.ve{color:var(--border)}
/* sync highlight — gold glow on synced column cells */
.sync-cell{background:rgba(201,168,76,.12)!important;color:var(--gold)!important;font-weight:500}
.sync-cell.latest-row{background:rgba(201,168,76,.22)!important}

/* SIGNAL PANEL */
.sc{background:var(--surface);border-left:1px solid var(--border);padding:12px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.s-lbl{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:3px;padding-bottom:3px;border-bottom:1px solid var(--border)}

/* MAIN SIGNAL BOX */
.sig-box{border-radius:7px;border:2px solid var(--border);overflow:hidden;background:var(--surface2);transition:all .25s}
.sig-box.active{border-color:var(--gold);box-shadow:0 0 20px rgba(201,168,76,.3)}
.sig-box.warn{border-color:var(--B-bright);box-shadow:0 0 14px rgba(231,76,60,.2)}
.sig-hdr{padding:7px 10px;background:var(--surface);display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--border)}
.sig-name{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:.06em;color:var(--muted);flex:1}
.sig-name.active{color:var(--gold)}
.sig-conf{font-size:9px;padding:2px 6px;border-radius:3px;letter-spacing:.05em}
.sig-conf.high{background:rgba(201,168,76,.2);color:var(--gold);border:1px solid rgba(201,168,76,.3)}
.sig-conf.med{background:rgba(82,183,136,.15);color:var(--pos);border:1px solid rgba(82,183,136,.3)}
.sig-body{padding:8px 10px;display:flex;align-items:center;gap:8px}
.sig-chip{font-family:'Bebas Neue',sans-serif;font-size:42px;width:52px;height:52px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:2px solid transparent;transition:all .2s}
.sig-chip.P{background:var(--P-dim);border-color:var(--P-bright);color:var(--P-bright)}
.sig-chip.B{background:var(--B-dim);border-color:var(--B-bright);color:var(--B-bright)}
.sig-chip.none{background:var(--surface2);border-color:var(--border);color:var(--muted);font-size:16px}
.sig-meta{flex:1;display:flex;flex-direction:column;gap:3px}
.sig-action{font-size:10px;color:var(--text);line-height:1.4}
.sig-reason{font-size:9px;color:var(--muted);line-height:1.5;margin-top:2px}
.sig-footer{padding:5px 10px 7px;font-size:9px;color:var(--muted);border-top:1px solid var(--border)}

/* SYNC METER */
.sync-meter{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px 10px}
.sync-bar-wrap{height:8px;background:var(--surface);border-radius:4px;overflow:hidden;margin:5px 0 3px}
.sync-bar{height:100%;border-radius:4px;background:var(--border);transition:width .3s,background .3s}
.sync-bar.s2{background:rgba(201,168,76,.5)}
.sync-bar.s3{background:var(--pos)}
.sync-bar.s4{background:var(--gold)}
.sync-cols{font-size:9px;color:var(--muted);line-height:1.5}

/* STATS */
.stats-g{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.stat{background:var(--surface2);border-radius:4px;padding:5px 7px;text-align:center}
.stat-v{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.04em}
.stat-l{font-size:9px;color:var(--muted);margin-top:1px}
.stat.sw .stat-v{color:var(--pos)}.stat.sl .stat-v{color:var(--neg)}
.stat.wr .stat-v{color:var(--gold)}.stat.sb .stat-v{color:var(--P-bright)}

/* RECENT */
.lb-wrap{display:flex;gap:3px;flex-wrap:wrap}
.lb{font-size:10px;padding:2px 5px;border-radius:3px;border:1px solid}
.lb.W{background:#0d2018;color:var(--pos);border-color:#2d6a4f}
.lb.L{background:var(--B-dim);color:var(--B-bright);border-color:var(--B)}
.lb.cur{border-color:var(--gold)!important}
</style>
</head>
<body>

<div class="hdr">
  <div>
    <div class="hdr-title">BP Sync Tracker</div>
    <div class="hdr-sub">synchronized oscillation · one bet · exit</div>
  </div>
  <div class="badge"><span>Hands</span><span id="handCount">0</span></div>
  <button class="btn" id="undoBtn" onclick="undo()" disabled>↩ Undo</button>
  <button class="btn danger" onclick="newShoe()">✕ New Shoe</button>
  <button class="btn gold" onclick="exportCSV()">↓ CSV</button>
</div>

<div class="main">

  <!-- OUTCOME -->
  <div class="oc">
    <div class="oc-lbl">Outcome</div>
    <div class="ob P" onclick="record('P')">P<div class="ob-sub">Player</div></div>
    <div class="ob T" onclick="record('T')">T<div class="ob-sub">Tie</div></div>
    <div class="ob B" onclick="record('B')">B<div class="ob-sub">Banker</div></div>
    <div class="oc-lbl" style="margin-top:6px">Result</div>
    <div class="wl">
      <div class="wlb W disabled" id="winBtn" onclick="recordResult('W')">W</div>
      <div class="wlb L disabled" id="lossBtn" onclick="recordResult('L')">L</div>
    </div>
    <div style="margin-top:6px;background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:6px 8px">
      <div style="font-size:9px;color:var(--muted);letter-spacing:.06em;margin-bottom:4px">Shoe record</div>
      <div style="display:flex;gap:4px;align-items:center">
        <div style="font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--pos)" id="shoeW">0</div>
        <div style="font-size:10px;color:var(--muted)">W</div>
        <div style="font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--neg)" id="shoeL">0</div>
        <div style="font-size:10px;color:var(--muted)">L</div>
      </div>
    </div>
  </div>

  <!-- GRID -->
  <div class="gc">
    <table class="st"><thead id="thead"></thead><tbody id="tbody"></tbody></table>
  </div>

  <!-- SIGNAL -->
  <div class="sc">

    <div>
      <div class="s-lbl">Signal</div>
      <div class="sig-box" id="sigBox">
        <div class="sig-hdr">
          <div class="sig-name" id="sigName">Watching</div>
          <span class="sig-conf" id="sigConf" style="display:none"></span>
        </div>
        <div class="sig-body">
          <div class="sig-chip none" id="sigChip">?</div>
          <div class="sig-meta">
            <div class="sig-action" id="sigAction">Enter outcomes</div>
            <div class="sig-reason" id="sigReason"></div>
          </div>
        </div>
        <div class="sig-footer" id="sigFooter">Need 4+ hands of sync</div>
      </div>
    </div>

    <div>
      <div class="s-lbl">Sync meter</div>
      <div class="sync-meter">
        <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--muted)">
          <span>Columns in sync</span>
          <span id="syncCount" style="color:var(--gold)">0</span>
        </div>
        <div class="sync-bar-wrap">
          <div class="sync-bar" id="syncBar" style="width:0%"></div>
        </div>
        <div class="sync-cols" id="syncCols">—</div>
      </div>
    </div>

    <div>
      <div class="s-lbl">Session stats</div>
      <div class="stats-g">
        <div class="stat sw"><div class="stat-v" id="stW">0</div><div class="stat-l">Wins</div></div>
        <div class="stat sl"><div class="stat-v" id="stL">0</div><div class="stat-l">Losses</div></div>
        <div class="stat wr"><div class="stat-v" id="stWR">—</div><div class="stat-l">Win rate</div></div>
        <div class="stat sb"><div class="stat-v" id="stBets">0</div><div class="stat-l">Bets</div></div>
      </div>
    </div>

    <div>
      <div class="s-lbl">Recent results</div>
      <div class="lb-wrap" id="lastBets">
        <span style="font-size:10px;color:var(--muted)">None yet</span>
      </div>
    </div>

  </div>
</div>

<script>
/* ── STATE ── */
let hands=[], series=[], seriesCounter=0;
let lastBP=null, bpCount=0;
let stats={wins:0,losses:0,bets:0};
let shoeWins=0, shoeLosses=0;
let skipNextBet=false;      // alternate rule — skip after each bet
let pauseHandsLeft=0;       // pause after loss
let hadLoss=false;          // skip rule only activates after first loss

/* ── SERIES ENGINE (Book rules) ── */
function fresh(val,bp){
  seriesCounter++;
  return{id:seriesCounter,value:val,closed:false,startBP:bp,
    initValue:val,zeroSpawned:false,snap:{}};
}

function recordBP(o,bi){
  if(lastBP===null){
    const a=fresh(+1,bi);a.snap[bi]=+1;series.push(a);
    const b=fresh(-1,bi);b.snap[bi]=-1;series.push(b);
    lastBP=o;return;
  }
  const isChop=o!==lastBP;
  const d=isChop?+1:-1;
  const posZero=[],negZero=[];
  const existing=[...series];

  for(const s of existing){
    if(s.closed)continue;
    s.value+=d;
    s.snap[bi]=s.value;
    if(s.value>=4||s.value<=-4){s.closed=true;continue;}
    if(s.id<=2)continue;
    if(s.initValue===+1&&s.value===0&&!s.zeroSpawned){
      s.zeroSpawned=true;posZero.push(bi);
    }
    if(s.initValue===-1&&s.value===0&&!s.zeroSpawned){
      s.zeroSpawned=true;negZero.push(bi);
    }
  }
  // Hand 2: always spawn S3/S4
  if(bi===2&&series.length===2){
    const c=fresh(+1,bi);c.snap[bi]=+1;series.push(c);
    const e=fresh(-1,bi);e.snap[bi]=-1;series.push(e);
  }
  for(const b of posZero){const n=fresh(+1,b);n.snap[b]=+1;series.push(n);}
  for(const b of negZero){const n=fresh(-1,b);n.snap[b]=-1;series.push(n);}
  lastBP=o;
}

/* ── SYNC DETECTION ── */
function getSeriesHistory(s,len){
  const keys=Object.keys(s.snap).map(Number).sort((a,b)=>a-b);
  return keys.slice(-len).map(k=>s.snap[k]);
}

function isSynced(s,minRounds){
  if(s.closed)return false;
  const v=s.snap[bpCount];
  if(v===undefined)return false;
  // Need at least minRounds of alternating pattern
  const hist=getSeriesHistory(s,minRounds+1);
  if(hist.length<minRounds)return false;
  // Check alternating: each step must be same delta (all +1 or all -1 alternating)
  // The pattern repeats: v, v±d, v, v±d...
  const d=hist[1]-hist[0];
  if(d===0)return false;
  for(let i=1;i<hist.length;i++){
    const expected=hist[i-1]+(i%2===1?d:-d);
    if(hist[i]!==expected)return false;
  }
  return true;
}

/* ── STAIRCASE DETECTION ── */
// Finds 3+ consecutive active series whose current values form
// a perfect descending sequence (each -1 from previous)
// with 0 sitting in the middle → bet chop
function staircasePersistCount(){
  // Count how many consecutive past BP hands also had a valid staircase
  if(bpCount<2)return 0;
  let count=0;
  // Check last 5 BP hands (excluding current)
  for(let bi=bpCount-1;bi>=Math.max(1,bpCount-5);bi--){
    const active=series.filter(s=>!s.closed&&s.snap[bi]!==undefined);
    if(active.length<3){break;}
    const sorted=active.map(s=>({v:s.snap[bi]})).sort((a,b)=>b.v-a.v);
    let found=false;
    for(let start=0;start<=sorted.length-3;start++){
      let len=1;
      for(let i=start+1;i<sorted.length;i++){
        if(sorted[i].v===sorted[i-1].v-1)len++;else break;
      }
      if(len<3)continue;
      const vals=sorted.slice(start,start+len).map(w=>w.v);
      if(vals.indexOf(0)!==-1){found=true;break;}
    }
    if(found)count++;else break;
  }
  return count;
}

function detectStaircase(){
  if(!lastBP||bpCount<7)return null;
  const active=series.filter(s=>!s.closed&&s.snap[bpCount]!==undefined);
  if(active.length<3)return null;

  // Sort by current value descending
  const sorted=active.map(s=>({s,v:s.snap[bpCount]}))
    .sort((a,b)=>b.v-a.v);

  // Find longest window where values are consecutive integers
  let best=null;
  for(let start=0;start<=sorted.length-3;start++){
    let len=1;
    for(let i=start+1;i<sorted.length;i++){
      if(sorted[i].v===sorted[i-1].v-1)len++;
      else break;
    }
    if(len<3)continue;
    const window=sorted.slice(start,start+len);
    const vals=window.map(w=>w.v);
    const zeroIdx=vals.indexOf(0);
    if(zeroIdx===-1)continue;
    const midStart=Math.floor(len*0.2);
    const midEnd=Math.ceil(len*0.8);
    const zeroInMiddle=zeroIdx>=midStart&&zeroIdx<=midEnd;
    const danger=vals.some(v=>Math.abs(v)>=3);
    const score=len*2+(zeroInMiddle?3:0)-(danger?2:0);
    if(!best||score>best.score){
      best={
        window,vals,zeroIdx,zeroInMiddle,danger,score,len,
        ids:window.map(w=>w.s.id),
        topVal:vals[0],botVal:vals[vals.length-1]
      };
    }
  }
  if(!best)return null;

  // Require staircase to have persisted for 3+ consecutive hands
  const persist=staircasePersistCount();
  if(persist<3)return null; // need 3 prior hands + current = 4 total confirmed

  const bet=lastBP==='B'?'P':'B';
  const conf=best.len>=5?'high':best.len>=4?'high':'med';
  return{
    type:'staircase',bet,
    ids:best.ids,vals:best.vals,
    zeroInMiddle:best.zeroInMiddle,
    danger:best.danger,conf,len:best.len,
    topVal:best.topVal,botVal:best.botVal,
    reason:`Staircase ${best.vals.map(v=>(v>=0?'+':'')+v).join(',')} · ${best.len} cols · 0 at pos ${best.zeroIdx+1}/${best.len}`
  };
}

function detectSync(){
  if(!lastBP||bpCount<4)return null;
  const active=series.filter(s=>!s.closed&&s.snap[bpCount]!==undefined);
  if(active.length<2)return null;

  const synced=active.filter(s=>isSynced(s,4));
  if(synced.length<2)return null;

  const needChop=synced.filter(s=>{
    const hist=getSeriesHistory(s,2);
    return hist.length===2&&hist[1]<hist[0];
  });
  const needStreak=synced.filter(s=>{
    const hist=getSeriesHistory(s,2);
    return hist.length===2&&hist[1]>hist[0];
  });

  const allChop=needChop.length===synced.length;
  const allStreak=needStreak.length===synced.length;
  if(!allChop&&!allStreak)return null;

  const type=allChop?'chop':'streak';
  const avgVal=synced.reduce((sum,s)=>sum+(s.snap[bpCount]||0),0)/synced.length;
  const zone=avgVal>=1?'high':avgVal<=-1?'low':'neutral';
  let effectiveType=type;
  let flipped=false;
  if(zone==='high'&&type==='chop'){effectiveType='streak';flipped=true;}
  const bet=effectiveType==='chop'?(lastBP==='B'?'P':'B'):lastBP;
  const danger=synced.some(s=>Math.abs(s.snap[bpCount])>=3);
  const conf=synced.length>=4?'high':synced.length>=3?'high':'med';

  return{
    bet,type:effectiveType,synced,syncCount:synced.length,
    syncIds:synced.map(s=>s.id),
    conf,danger,zone,flipped,
    avgVal:Math.round(avgVal*10)/10,
    reason:`${synced.length} cols sync · zone ${zone==='high'?'⬆ high (flipped)':zone==='low'?'⬇ low':'→ neutral'} · avg ${avgVal>=0?'+':''}${Math.round(avgVal*10)/10}`
  };
}

// Combined detection — staircase takes priority
function detectSignal(){
  // Pause after loss
  if(pauseHandsLeft>0)return null;
  // Alternate — skip every other hand
  if(skipNextBet)return null;
  const stair=detectStaircase();
  if(stair)return stair;
  const sync=detectSync();
  if(sync)return sync;
  return null;
}

// Raw detection — used for meter display (ignores skip/pause)
function detectSignalRaw(){
  const stair=detectStaircase();
  if(stair)return stair;
  return detectSync();
}

/* ── RENDER ── */
function render(){
  bpCount=hands.filter(h=>h.outcome!=='T').length;
  document.getElementById('handCount').textContent=hands.length;
  document.getElementById('undoBtn').disabled=!hands.length;
  renderGrid();
  renderSignal();
  renderStats();
}

function renderGrid(){
  const head=document.getElementById('thead');
  const body=document.getElementById('tbody');
  const ids=[...new Set(series.map(s=>s.id))].sort((a,b)=>a-b);
  const sig=detectSignal();
  const syncIds=sig?new Set(sig.type==='staircase'?sig.ids:sig.syncIds||[]):new Set();

  head.innerHTML=`<tr>
    <th class="td-n">#</th>
    <th class="thP">P</th><th class="thB">B</th><th class="thS">S</th>
    ${ids.map(id=>`<th class="thN${syncIds.has(id)?' synced':''}">${id}</th>`).join('')}
  </tr>`;

  if(!hands.length){
    body.innerHTML=`<tr><td class="td-n" colspan="${4+ids.length}" style="padding:14px;color:var(--muted);font-size:10px;text-align:center">Enter outcomes to begin</td></tr>`;
    return;
  }

  let bp=0;
  body.innerHTML=hands.map((h,hi)=>{
    if(h.outcome!=='T')bp++;
    const isLatest=hi===hands.length-1;
    const curBP=h.outcome!=='T'?bp:null;
    const pM=h.outcome==='P'?`<span class="dot-P">O</span>`:'';
    const bM=h.outcome==='B'?`<span class="dot-B">O</span>`:'';
    const tM=h.outcome==='T'?`<span class="dot-T">T</span>`:'';
    const sM=h.standing?`<span class="${h.standing.slice(-1)==='L'?'sL':'sW'}">${h.standing}</span>`:'';

    const cells=h.outcome==='T'
      ?ids.map(()=>`<td class="ve">·</td>`).join('')
      :ids.map(id=>{
          const s=series.find(s=>s.id===id);
          const v=s.snap[curBP];
          if(v===undefined)return`<td class="ve">·</td>`;
          if(s.closed&&(v>=4||v<=-4)&&s.snap[curBP+1]===undefined){}
          else if(s.closed&&v===undefined)return`<td class="v4">✕</td>`;
          let cls='';
          if(v>0)cls='vp';else if(v<0)cls='vn';else cls='vz';
          if(v===3||v===-3)cls='v3';
          if(v>=4||v<=-4)cls='v4';
          // Sync highlight — gold for synced columns
          const isSyncCol=syncIds.has(id);
          if(isSyncCol)cls='sync-cell'+(isLatest?' latest-row':'');
          return`<td class="${cls}">${v>0?'+':''}${v}</td>`;
        }).join('');

    return`<tr class="${isLatest?'latest':''}">
      <td class="td-n">${hi+1}</td>
      <td>${pM}${tM}</td><td>${bM}</td>
      <td class="td-s">${sM}</td>
      ${cells}
    </tr>`;
  }).join('');

  const gc=document.querySelector('.gc');
  if(gc)gc.scrollTop=gc.scrollHeight;
}

function renderSignal(){
  const sig=detectSignal();
  const box=document.getElementById('sigBox');
  const chip=document.getElementById('sigChip');
  const name=document.getElementById('sigName');
  const conf=document.getElementById('sigConf');
  const action=document.getElementById('sigAction');
  const reason=document.getElementById('sigReason');
  const footer=document.getElementById('sigFooter');
  const meter=document.getElementById('syncCount');
  const bar=document.getElementById('syncBar');
  const cols=document.getElementById('syncCols');

  // Sync meter — always show best available
  const active=series.filter(s=>!s.closed&&s.snap[bpCount]!==undefined);
  const stair=detectStaircase();
  const sync=detectSync();
  if(stair){
    meter.textContent=stair.len;
    bar.style.width='100%';bar.className='sync-bar s4';
    cols.textContent=`Staircase S${stair.ids.join(',S')} · ${stair.vals.map(v=>(v>=0?'+':'')+v).join(',')}`;
  } else {
    const synced4=active.filter(s=>isSynced(s,4));
    const synced2=active.filter(s=>isSynced(s,2));
    const pct=Math.min(100,synced4.length/Math.max(active.length,1)*100);
    meter.textContent=synced4.length;
    bar.style.width=pct+'%';
    bar.className='sync-bar '+(synced4.length>=4?'s4':synced4.length>=3?'s3':'s2');
    if(synced4.length>0)cols.textContent=`S${synced4.map(s=>s.id).join(', S')} locked · ${active.length} active`;
    else if(synced2.length>0)cols.textContent=`S${synced2.map(s=>s.id).join(', S')} building`;
    else cols.textContent='No sync detected yet';
  }

  if(!sig){
    box.className='sig-box';
    chip.className='sig-chip none';chip.textContent='?';
    name.textContent=pauseHandsLeft>0?'Paused':skipNextBet?'Skipping':'Watching';
    name.className='sig-name';
    conf.style.display='none';
    const raw=detectSignalRaw();
    if(pauseHandsLeft>0){
      action.textContent=`After loss — ${pauseHandsLeft} hand${pauseHandsLeft!==1?'s':''} remaining`;
      reason.textContent='Pause rule: wait 3 hands after a loss';
    } else if(skipNextBet){
      action.textContent=raw?`Pattern seen — skipping this hand`:'No pattern yet';
      reason.textContent='Alternate rule: skip every other signal';
    } else {
      action.textContent=bpCount<5?`Need ${5-bpCount} more hand${5-bpCount!==1?'s':''}`:
        raw?'Building…':'No pattern yet';
      reason.textContent='';
    }
    footer.textContent='Watching for staircase or sync pattern';
    return;
  }

  // Staircase signal
  if(sig.type==='staircase'){
    box.className=`sig-box ${sig.danger?'warn':'active'}`;
    chip.className=`sig-chip ${sig.bet}`;chip.textContent=sig.bet;
    name.textContent=`Staircase ${sig.len} Col`;name.className='sig-name active';
    conf.style.display='inline-block';
    conf.className=`sig-conf ${sig.danger?'med':sig.conf}`;
    conf.textContent=sig.danger?'⚠ CAUTION':sig.zeroInMiddle?'HIGH':'MOD';
    action.textContent=`Bet ${sig.bet==='P'?'Player':'Banker'} — chop continues`;
    reason.textContent=sig.reason;
    footer.textContent=`0 anchored in middle · one bet · exit${sig.danger?' · ⚠ near ±3':''}`;
    return;
  }

  // Sync signal
  box.className=`sig-box ${sig.danger?'warn':'active'}`;
  chip.className=`sig-chip ${sig.bet}`;chip.textContent=sig.bet;
  name.textContent=`${sig.syncCount} Col Sync${sig.flipped?' — Flipped':''}`;
  name.className='sig-name active';
  conf.style.display='inline-block';
  conf.className=`sig-conf ${sig.danger?'med':sig.conf}`;
  conf.textContent=sig.danger?'⚠ CAUTION':sig.flipped?'FLIPPED':sig.conf==='high'?'HIGH':'MOD';
  action.textContent=`Bet ${sig.bet==='P'?'Player':'Banker'} — ${sig.type}`;
  reason.textContent=sig.reason;
  footer.textContent=sig.flipped?'High zone — bet reversed · one bet · exit':
    sig.type==='chop'?'Opposite of last · one bet · exit':'Same as last · one bet · exit';
}

function renderStats(){
  document.getElementById('stW').textContent=stats.wins;
  document.getElementById('stL').textContent=stats.losses;
  const total=stats.wins+stats.losses;
  document.getElementById('stWR').textContent=total?Math.round(stats.wins/total*100)+'%':'—';
  document.getElementById('stBets').textContent=stats.bets;
  document.getElementById('shoeW').textContent=shoeWins;
  document.getElementById('shoeL').textContent=shoeLosses;
  const unres=hands.some(h=>h.result===null&&h.outcome!=='T');
  document.getElementById('winBtn').classList.toggle('disabled',!unres);
  document.getElementById('lossBtn').classList.toggle('disabled',!unres);
}

/* ── EXPORT ── */
function exportCSV(){
  if(!hands.length){alert('No data.');return;}
  const ids=[...new Set(series.map(s=>s.id))].sort((a,b)=>a-b);
  const hdr=['Hand','Outcome','BP_Index','Sig_Bet','Sync_Count','Danger','Result','Standing',...ids.map(i=>'S'+i)];
  let bp=0;
  const rows=hands.map(h=>{
    if(h.outcome!=='T')bp++;
    const curBP=h.outcome!=='T'?bp:null;
    const vals=ids.map(id=>{
      const s=series.find(s=>s.id===id);
      return curBP&&s.snap[curBP]!==undefined?s.snap[curBP]:'';
    });
    return[h.handNum,h.outcome,curBP||'',h.sigBet||'',h.syncCount||'',h.danger||'',h.result||'',h.standing||'',...vals].join(',');
  });
  const csv=[hdr.join(','),...rows].join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`sync-shoe-${Date.now()}.csv`;a.click();
  URL.revokeObjectURL(url);
}

/* ── ACTIONS ── */
function record(o){
  const sig=detectSignal();
  const handNum=hands.length+1;
  hands.push({handNum,outcome:o,result:null,standing:'',
    sigBet:sig?sig.bet:'',
    syncCount:sig?sig.type==='staircase'?sig.len:sig.syncCount:0,
    danger:sig&&sig.danger?'yes':''
  });
  if(o!=='T'){
    bpCount++;
    recordBP(o,bpCount);
    // Advance pause counter
    if(pauseHandsLeft>0){
      pauseHandsLeft--;
    }
    // Reset skip — ready to bet again next signal
    else if(skipNextBet){
      skipNextBet=false;
    }
  }
  render();
}

function recordResult(res){
  const last=hands.slice().reverse().find(h=>h.result===null&&h.outcome!=='T');
  if(!last)return;
  last.result=res;
  last.standing=res;
  stats.bets++;
  if(res==='W'){
    stats.wins++;shoeWins++;
    if(hadLoss)skipNextBet=true; // alternate only after first loss
    pauseHandsLeft=0;
  } else {
    stats.losses++;shoeLosses++;
    hadLoss=true;
    skipNextBet=false;
    pauseHandsLeft=3;
  }
  render();
}

function undo(){
  if(!hands.length)return;
  const last=hands[hands.length-1];
  if(last.result!==null){
    if(last.result==='W'){stats.wins--;shoeWins--;}
    else{stats.losses--;shoeLosses--;}
    stats.bets--;last.result=null;last.standing='';
    skipNextBet=false;pauseHandsLeft=0;hadLoss=false;
  } else {
    hands.pop();
    if(last.outcome!=='T'){
      series=[];seriesCounter=0;lastBP=null;bpCount=0;
      hands.filter(h=>h.outcome!=='T').forEach((h,i)=>recordBP(h.outcome,i+1));
      bpCount=hands.filter(h=>h.outcome!=='T').length;
    }
  }
  render();
}

function newShoe(){
  if(!confirm('New shoe? All data cleared.'))return;
  hands=[];series=[];seriesCounter=0;lastBP=null;bpCount=0;
  shoeWins=0;shoeLosses=0;skipNextBet=false;pauseHandsLeft=0;hadLoss=false;render();
}

render();
</script>
